[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "swarm-self-healing"
version = "0.1.0"
description = "Deterministic homeostasis, sub-5s hot failover, preventive heat cooldown, and resource circuit breakers for autonomous agent swarms."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "hsnlabs Distributed Systems & Protocol Engineering", email = "engineering@hsnlabs.ai" }
]
keywords = [
    "agents",
    "swarm",
    "self-healing",
    "homeostasis",
    "circuit-breaker",
    "resilience",
    "anti-ban",
    "hsnlabs"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "pydantic>=2.7.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.urls]
Homepage = "https://hsnlabs.ai/en/products/swarm-self-healing/"
Repository = "https://github.com/hsnlabs-ai/swarm-self-healing"
Specification = "https://github.com/hsnlabs-ai/swarm-self-healing/blob/main/docs/SPECIFICATION.md"

[tool.hatch.build.targets.wheel]
packages = ["swarm_self_healing"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
